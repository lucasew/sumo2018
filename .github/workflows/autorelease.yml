name: Autorelease

on:
  push:
    branches:
      - main
      - master
    tags:
      - v*
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  autorelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Install
        run: mise run install

      - name: Codegen
        run: mise run codegen

      - name: PR if Difference
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes detected. Creating PR..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            BRANCH_NAME="codegen-update-$(date +%s)"
            git checkout -b $BRANCH_NAME
            git add .
            git commit -m "chore: update generated code"
            git push origin $BRANCH_NAME
            gh pr create --title "chore: update generated code" --body "Automated PR to update generated code." --base ${{ github.ref_name }} --head $BRANCH_NAME
          else
            echo "No changes detected."
          fi

      - name: CI
        run: mise run ci

      - name: Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            gh release create ${{ github.ref_name }} --generate-notes
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
             echo "Manual release triggered. Skipping creation for now as no tag provided."
             # Or create a release based on timestamp?
          fi

      - name: Upload Artifacts
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/
